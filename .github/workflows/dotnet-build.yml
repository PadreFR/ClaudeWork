name: .NET Build

on:
  pull_request:
    paths:
      - 'hello-world/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore hello-world/HelloWorld.csproj

      - name: Build
        run: dotnet build hello-world/HelloWorld.csproj --no-restore --configuration Release
