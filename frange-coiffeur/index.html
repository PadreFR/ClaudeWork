<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one booking card. Steps on the left, a running ticket of the appointment on the right; it stacks to one column on phones. */
:root{
  --paper:#F4F5F7;
  --card:#FFFFFF;
  --ink:#15171D;
  --muted:#596070;
  --line:#DADDE4;
  --rouge:#A8123C;      /* 6.66, rouge intense */
  --on-rouge:#FFFFFF;
  --blond:#F0E4BF;      /* 9.3, blond très clair doré */
  --on-blond:#3B3216;
  --ok:#1F7A4D;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1116; --card:#171A21; --ink:#ECEEF2; --muted:#9AA1B0; --line:#2A2F3A;
    --rouge:#F2577F; --on-rouge:#1C0710; --blond:#3A321B; --on-blond:#F1E3B8; --ok:#5BC48E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1116; --card:#171A21; --ink:#ECEEF2; --muted:#9AA1B0; --line:#2A2F3A;
  --rouge:#F2577F; --on-rouge:#1C0710; --blond:#3A321B; --on-blond:#F1E3B8; --ok:#5BC48E;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link:hover{color:var(--rouge)}

.shell{width:100%;max-width:1000px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);padding-block:clamp(16px,4vw,40px) 48px}

/* Salon header */
.salon{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-bottom:20px}
.mark{flex:none;width:54px;height:54px;border-radius:16px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:34px;height:34px;color:var(--paper)}
.salon-id{min-width:0;flex:1 1 220px}
.salon h1{font-weight:800;font-size:clamp(1.9rem,4.4vw,2.6rem);line-height:1;letter-spacing:-.04em;font-variation-settings:"opsz" 96}
.salon-sub{color:var(--muted);font-size:15px;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.open::before{background:var(--ok)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rouge)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding-inline:6px;border-radius:999px;background:var(--rouge);color:var(--on-rouge);font:500 11px/1 var(--f-mono)}

/* Booking layout */
.book{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;min-width:0}
.main{display:flex;flex-direction:column}
.progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:18px 24px 0}
.progress span{height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--rouge)}
.step-head{padding:16px 24px 4px}
.step-head .eyebrow{font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step-head h2{font-weight:800;font-size:clamp(1.5rem,3vw,1.9rem);letter-spacing:-.03em;margin-top:6px;outline:none}
.step-body{padding:16px 24px 24px;display:flex;flex-direction:column;gap:22px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line)}
.foot .hint{flex:1;min-width:0;font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1.1 var(--f-body);padding:13px 20px;border-radius:12px;border:1px solid transparent;transition:background-color .15s,border-color .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 85%,var(--rouge))}
.btn-accent{background:var(--rouge);color:var(--on-rouge)}
.btn-accent:hover:not(:disabled){background:color-mix(in srgb,var(--rouge) 86%,var(--ink))}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}

/* Step 1: services */
.cat{border:0;margin:0;padding:0;display:grid;gap:8px}
.cat legend{font:700 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px}
.svc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 14px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s}
.svc:hover{border-color:var(--muted)}
.svc:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.svc input{grid-row:1 / span 2;accent-color:var(--rouge);width:18px;height:18px;margin:0}
.svc-name{font-weight:600}
.svc-note{grid-column:2;font-size:13px;color:var(--muted)}
.svc-price{grid-row:1 / span 2;grid-column:3;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.svc-price small{display:block;font:400 12px var(--f-body);color:var(--muted)}

/* Step 2: staff, days, times */
.label{font-size:14px;font-weight:700;margin-bottom:10px}
.staff{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-align:left}
.person:hover{border-color:var(--ink)}
.person[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blond);color:var(--on-blond);font:700 13px var(--f-display)}
.person[aria-pressed="true"] .avatar{background:var(--rouge);color:var(--on-rouge)}
.person b{display:block;font-size:14px;line-height:1.2}
.person small{display:block;font-size:12px;opacity:.7;line-height:1.2}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.day{flex:none;scroll-snap-align:start;width:74px;display:grid;gap:1px;justify-items:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.day:hover:not(:disabled){border-color:var(--ink)}
.day .dw{font-size:12px;color:var(--muted)}
.day .dn{font:700 21px/1.1 var(--f-display)}
.day .dm{font:500 10px var(--f-mono);color:var(--muted);white-space:nowrap}
.day:disabled{opacity:.45;cursor:not-allowed;background:var(--paper)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dm{color:inherit;opacity:.75}
.times{display:grid;gap:18px}
.times h3{font:700 13px var(--f-body);color:var(--muted);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font:500 14px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--rouge);color:var(--rouge)}
.slot[aria-pressed="true"]{background:var(--rouge);color:var(--on-rouge);border-color:var(--rouge)}
.empty{padding:28px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);display:grid;justify-items:center;gap:12px}
.empty h3{font-size:20px;color:var(--ink)}
.warn{padding:10px 14px;border-radius:10px;background:var(--blond);color:var(--on-blond);font-size:14px}

/* Step 3: form */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.form .full{grid-column:1 / -1}
.form label{display:grid;gap:6px;font-size:14px;font-weight:600}
.form label .opt{font-weight:400;color:var(--muted)}
.form input,.form textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:16px;font-weight:400}
.form textarea{min-height:84px;resize:vertical}
.form input:focus,.form textarea:focus{outline:2px solid var(--rouge);outline-offset:0;border-color:transparent}
.form [aria-invalid="true"]{border-color:var(--rouge)}
.err{color:var(--rouge);font-size:13px;font-weight:600}

/* Recap ticket */
.recap{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));padding:20px;display:flex;flex-direction:column;gap:16px}
.recap h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.recap dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px}
.recap dt{color:var(--muted)}
.recap dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.recap dd.none{color:var(--muted);font-weight:400}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px dashed var(--line)}
.total b{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.hours summary{cursor:pointer;font-size:14px;font-weight:600}
.hours table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.hours td{padding:3px 0;color:var(--muted)}
.hours td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hours tr.today td{color:var(--ink);font-weight:600}

/* Confirmation */
.done{display:grid;justify-items:center;text-align:center;gap:12px;padding:40px 24px 32px}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--rouge);color:var(--on-rouge);display:grid;place-items:center}
.done h2{font-size:clamp(1.6rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.03em;outline:none}
.done p{max-width:46ch}
.ref{font:500 15px var(--f-mono);padding:6px 12px;border-radius:8px;background:var(--blond);color:var(--on-blond)}
.done .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}

/* Mes rendez-vous */
.mine{display:grid;gap:12px}
.mine h2{font:700 13px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.appt-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.appt{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.appt.past{opacity:.6}
.when{display:grid;justify-items:center;align-content:center;background:var(--paper);border-radius:12px;padding:8px 4px}
.when .dw{font-size:12px;color:var(--muted)}
.when .dn{font:700 24px/1.1 var(--f-display)}
.when .dm{font:500 11px var(--f-mono);color:var(--muted)}
.appt-main{display:grid;gap:3px;min-width:0}
.appt-time{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.appt-svc{font-weight:700;font-size:17px}
.appt-meta{font-size:14px;color:var(--muted)}
.appt-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px;font-size:14px}

.demo{margin-top:20px;font-size:13px;color:var(--muted);text-align:center}

@media (max-width: 860px){
  .book{grid-template-columns:minmax(0,1fr)}
  .recap{position:static}
}
@media (max-width: 560px){
  .progress,.step-head,.step-body,.foot{padding-inline:16px}
  .form{grid-template-columns:minmax(0,1fr)}
  .foot .hint{flex-basis:100%}
  .foot .btn{flex:1}
  .person{padding-right:12px}
}
</style>
</head>
<body>

<div class="shell">
  <header class="salon">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><path d="M5 18a11 11 0 0 1 22 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="var(--rouge)" stroke-width="2.6" stroke-linecap="round"><path d="M9.5 13.5 8.6 21"/><path d="M13.4 11.2 12.9 22"/><path d="M17.4 11 17.4 20.5"/><path d="M21.2 12 21.9 21.5"/><path d="M24.6 14.6 25.6 20"/></g></svg>
    </div>
    <div class="salon-id">
      <h1 id="salon-name">Frange</h1>
      <p class="salon-sub" id="salon-sub"></p>
    </div>
    <span class="status" id="status"></span>
  </header>

  <div class="tabs" role="tablist" aria-label="Rendez-vous">
    <button type="button" class="tab" role="tab" id="tab-book" aria-controls="view-book" aria-selected="true" data-tab="book">Prendre rendez-vous</button>
    <button type="button" class="tab" role="tab" id="tab-mine" aria-controls="view-mine" aria-selected="false" data-tab="mine">Mes rendez-vous <span class="count" id="count" hidden>0</span></button>
  </div>

  <section id="view-book" role="tabpanel" aria-labelledby="tab-book"></section>
  <section id="view-mine" role="tabpanel" aria-labelledby="tab-mine" hidden></section>

  <p class="demo">Démonstration : rien n’est envoyé au salon. Les rendez-vous restent dans ce navigateur.</p>
</div>

<script>
(() => {
'use strict';

/* ======================================================================
   Configuration du salon. C’est la seule partie à modifier.
   Heures en minutes depuis minuit (540 = 9h00). Jours : 0 = dimanche.
   ====================================================================== */
const CONFIG = {
  salon: { name: 'Frange', kind: 'Salon de coiffure', address: '12 rue Pasteur, 69003 Lyon' },
  hours: { 0: null, 1: null, 2: [540, 1140], 3: [540, 1140], 4: [540, 1200], 5: [540, 1200], 6: [540, 1080] },
  closedDates: ['2026-11-11', '2026-12-25', '2027-01-01'],
  slotStep: 15,          // pas entre deux heures proposées, en minutes
  minNotice: 60,         // délai minimum avant un rendez-vous, en minutes
  daysAhead: 21,         // nombre de jours réservables
  cancelHours: 24,       // annulation en ligne possible jusqu’à N heures avant
  staff: [
    { id: 'lea', name: 'Léa', role: 'Coloriste', days: [2, 3, 4, 5, 6] },
    { id: 'karim', name: 'Karim', role: 'Coiffeur et barbier', days: [2, 3, 5, 6] },
    { id: 'ines', name: 'Inès', role: 'Coiffeuse', days: [3, 4, 5, 6] }
  ],
  categories: [
    { name: 'Coupe et coiffage', items: [
      { id: 'cfc', n: 'Shampoing, coupe et brushing', note: 'Cheveux courts', m: 45, p: 42 },
      { id: 'cfl', n: 'Shampoing, coupe et brushing', note: 'Cheveux mi-longs à longs', m: 60, p: 52 },
      { id: 'bru', n: 'Shampoing et brushing', m: 30, p: 28 },
      { id: 'chi', n: 'Chignon ou coiffure de soirée', m: 60, p: 55 }
    ]},
    { name: 'Couleur', items: [
      { id: 'rac', n: 'Couleur racines et brushing', m: 90, p: 65 },
      { id: 'col', n: 'Couleur complète et brushing', m: 105, p: 78 },
      { id: 'bal', n: 'Balayage, patine et brushing', m: 150, p: 120 },
      { id: 'veg', n: 'Couleur végétale', note: 'Henné, indigo ou cassia', m: 120, p: 80 }
    ]},
    { name: 'Soins', items: [
      { id: 'ker', n: 'Soin profond à la kératine', m: 45, p: 40 },
      { id: 'spa', n: 'Head spa', note: 'Massage du cuir chevelu et soin', m: 60, p: 60 },
      { id: 'lis', n: 'Lissage brésilien', note: 'Prix selon la longueur', m: 180, p: 160, from: true }
    ]},
    { name: 'Homme et enfant', items: [
      { id: 'hom', n: 'Coupe homme', m: 30, p: 25 },
      { id: 'hob', n: 'Coupe et taille de barbe', m: 45, p: 38 },
      { id: 'enf', n: 'Coupe enfant', note: 'Moins de 12 ans', m: 20, p: 16 }
    ]}
  ]
};

/* ======================================================================
   Stockage des rendez-vous. Ici dans le navigateur ; pour un vrai salon,
   remplacer load / add / remove par des appels au serveur.
   ====================================================================== */
const STORE_KEY = 'frange.rendezvous.v1';
let bookings = [];
const store = {
  load(){
    try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); bookings = Array.isArray(v) ? v : []; } catch (e) { bookings = []; }
  },
  add(rec){ bookings = bookings.concat(rec); this.persist(); },
  remove(id){ bookings = bookings.filter(b => b.id !== id); this.persist(); },
  persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(bookings)); } catch (e) {} }
};

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const NB = ' ';
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const euro = n => n + NB + '€';
const fmtMin = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const fmtH = m => Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '');
const fmtDur = m => m < 60 ? m + NB + 'min' : Math.floor(m / 60) + NB + 'h' + (m % 60 ? NB + pad(m % 60) : '');
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const today = () => startOfDay(new Date());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayOffset = d => Math.round((startOfDay(d) - today()) / 864e5);
const fLong = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fWk = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' });
const fWkLong = new Intl.DateTimeFormat('fr-FR', { weekday: 'long' });
const fMon = new Intl.DateTimeFormat('fr-FR', { month: 'short' });
const initials = n => n.trim().charAt(0).toUpperCase();

const SERVICES = Object.fromEntries(CONFIG.categories.flatMap(c => c.items).map(s => [s.id, s]));
const STAFF = Object.fromEntries(CONFIG.staff.map(s => [s.id, s]));
const svcLabel = s => s.n + (s.note ? ' (' + s.note.toLowerCase() + ')' : '');

/* Deterministic randomness for the demo agenda */
function rng(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ---------- Availability ---------- */
function hoursOn(date){
  if (CONFIG.closedDates.includes(ymd(date))) return null;
  return CONFIG.hours[date.getDay()] || null;
}
/* Demo only: the salon’s existing appointments, so the agenda is not empty */
const agendaCache = new Map();
function demoAgenda(staffId, date){
  const key = staffId + '|' + ymd(date);
  if (agendaCache.has(key)) return agendaCache.get(key);
  const h = hoursOn(date);
  const out = [];
  if (h){
    const r = rng(key);
    for (let m = h[0]; m < h[1];){
      const len = [30, 45, 60, 60, 90, 120][Math.floor(r() * 6)];
      if (r() < 0.5) out.push([m, m + len]);
      m += len + (r() < 0.3 ? 15 : 0);
    }
  }
  agendaCache.set(key, out);
  return out;
}
function busy(staffId, date){
  const d = ymd(date);
  return demoAgenda(staffId, date).concat(bookings.filter(b => b.date === d && b.staffId === staffId).map(b => [b.time, b.time + b.dur]));
}
function isFree(st, date, m, dur){
  if (!st.days.includes(date.getDay())) return false;
  const h = hoursOn(date);
  if (!h || m < h[0] || m + dur > h[1]) return false;
  return !busy(st.id, date).some(([a, b]) => m < b && m + dur > a);
}
function team(staffId){ return staffId ? [STAFF[staffId]] : CONFIG.staff; }
/* Start times for a day: null = salon closed, 'absent' = chosen person not working, [] = full */
function slotsOn(date, dur, staffId){
  const h = hoursOn(date);
  if (!h) return null;
  const people = team(staffId).filter(s => s.days.includes(date.getDay()));
  if (!people.length) return 'absent';
  const now = new Date();
  const earliest = dayOffset(date) === 0 ? now.getHours() * 60 + now.getMinutes() + CONFIG.minNotice : -1;
  const out = [];
  for (let m = h[0]; m + dur <= h[1]; m += CONFIG.slotStep){
    if (m < earliest) continue;
    if (people.some(s => isFree(s, date, m, dur))) out.push(m);
  }
  return out;
}

/* ---------- State ---------- */
const S = {
  tab: 'book', step: 1, svc: null, staff: '', day: null, time: null,
  form: { prenom: '', nom: '', tel: '', email: '', note: '' }, errors: {},
  done: null, cancelId: null, focusHeading: false, warn: ''
};

/* ---------- Header ---------- */
function renderHeader(){
  $('#salon-name').textContent = CONFIG.salon.name;
  $('#salon-sub').textContent = CONFIG.salon.kind + ' · ' + CONFIG.salon.address;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const h = hoursOn(today());
  const st = $('#status');
  if (h && nowMin >= h[0] && nowMin < h[1]){
    st.className = 'status open';
    st.textContent = 'Ouvert · ferme à ' + fmtH(h[1]);
    return;
  }
  st.className = 'status';
  if (h && nowMin < h[0]){ st.textContent = 'Fermé · ouvre à ' + fmtH(h[0]); return; }
  for (let i = 1; i <= 14; i++){
    const d = addDays(today(), i);
    const hh = hoursOn(d);
    if (hh){ st.textContent = 'Fermé · ouvre ' + (i === 1 ? 'demain' : fWkLong.format(d)) + ' à ' + fmtH(hh[0]); return; }
  }
  st.textContent = 'Fermé';
}

/* ---------- Booking view ---------- */
const STEP_TITLES = ['Choisissez une prestation', 'Choisissez un créneau', 'Vos coordonnées'];

function renderBook(){
  const root = $('#view-book');
  if (S.step === 4){
    root.innerHTML = `<div class="panel">${doneView()}</div>`;
    return;
  }
  let body = '', foot = '';
  if (S.step === 1){
    body = stepServices();
    foot = `<p class="hint">${S.svc ? 'Prix à régler au salon.' : 'Sélectionnez une prestation pour continuer.'}</p><button type="button" class="btn btn-primary" data-go="2" data-key="next" ${S.svc ? '' : 'disabled'}>Continuer</button>`;
  } else if (S.step === 2){
    body = stepSlots();
    foot = `<button type="button" class="btn btn-ghost" data-go="1" data-key="back">Retour</button><button type="button" class="btn btn-primary" data-go="3" data-key="next" ${S.time != null ? '' : 'disabled'}>Continuer</button>`;
  } else {
    body = stepForm();
    foot = `<button type="button" class="btn btn-ghost" data-go="2" data-key="back">Retour</button><button type="submit" form="client-form" class="btn btn-accent" data-key="confirm">Confirmer le rendez-vous</button>`;
  }
  root.innerHTML = `<div class="book">
    <div class="panel main">
      <div class="progress" aria-hidden="true">${[1, 2, 3].map(i => `<span class="${i <= S.step ? 'on' : ''}"></span>`).join('')}</div>
      <div class="step-head"><p class="eyebrow">Étape ${S.step} sur 3</p><h2 tabindex="-1" id="step-title">${STEP_TITLES[S.step - 1]}</h2></div>
      <div class="step-body">${body}</div>
      <div class="foot">${foot}</div>
    </div>
    <aside class="panel recap" aria-labelledby="recap-title">${recapView()}</aside>
  </div>`;
}

function stepServices(){
  return CONFIG.categories.map(c => `<fieldset class="cat"><legend>${esc(c.name)}</legend>${c.items.map(s => `
    <label class="svc">
      <input type="radio" name="svc" value="${s.id}" ${S.svc === s.id ? 'checked' : ''}>
      <span class="svc-name">${esc(s.n)}</span>
      <span class="svc-price">${s.from ? '<small>dès</small>' : ''}${euro(s.p)}</span>
      <span class="svc-note">${s.note ? esc(s.note) + ' · ' : ''}${fmtDur(s.m)}</span>
    </label>`).join('')}</fieldset>`).join('');
}

function stepSlots(){
  const dur = SERVICES[S.svc].m;
  const days = Array.from({ length: CONFIG.daysAhead }, (_, i) => addDays(today(), i));
  const avail = days.map(d => slotsOn(d, dur, S.staff));
  const ok = i => Array.isArray(avail[i]) && avail[i].length > 0;
  let idx = S.day ? days.findIndex(d => ymd(d) === S.day) : -1;
  if (idx < 0 || !ok(idx)){ idx = avail.findIndex((a, i) => ok(i)); S.time = null; }
  S.day = idx >= 0 ? ymd(days[idx]) : null;
  if (S.time != null && !avail[idx].includes(S.time)) S.time = null;

  const people = [{ id: '', name: 'Sans préférence', role: 'Le premier disponible' }].concat(CONFIG.staff);
  const staffHtml = people.map(p => `<button type="button" class="person" data-staff="${p.id}" data-key="staff-${p.id || 'any'}" aria-pressed="${S.staff === p.id}">
      <span class="avatar" aria-hidden="true">${p.id ? esc(initials(p.name)) : '∗'}</span><span><b>${esc(p.name)}</b><small>${esc(p.role)}</small></span></button>`).join('');

  const dayHtml = days.map((d, i) => {
    const a = avail[i];
    const label = a === null ? 'fermé' : a === 'absent' ? 'absent' : a.length ? a.length + ' libres' : 'complet';
    return `<button type="button" class="day" data-day="${ymd(d)}" data-key="day-${ymd(d)}" aria-pressed="${i === idx}" ${ok(i) ? '' : 'disabled'} aria-label="${cap(fLong.format(d))}, ${label}">
      <span class="dw">${i === 0 ? 'auj.' : i === 1 ? 'dem.' : fWk.format(d)}</span><span class="dn">${d.getDate()}</span><span class="dm">${label}</span></button>`;
  }).join('');

  let timesHtml;
  if (idx < 0){
    timesHtml = `<div class="empty"><h3>Aucun créneau sur les ${CONFIG.daysAhead} prochains jours</h3><p>${S.staff ? 'Essayez sans préférence de coiffeur, ou une prestation plus courte.' : 'Essayez une prestation plus courte.'}</p>${S.staff ? '<button type="button" class="btn btn-ghost" data-staff="" data-key="staff-any">Voir toute l’équipe</button>' : ''}</div>`;
  } else {
    const groups = [['Matin', m => m < 720], ['Après-midi', m => m >= 720 && m < 1020], ['Soir', m => m >= 1020]];
    timesHtml = `<div class="times">${groups.map(([g, fn]) => {
      const list = avail[idx].filter(fn);
      return list.length ? `<div><h3>${g}</h3><div class="grid">${list.map(m => `<button type="button" class="slot" data-time="${m}" data-key="time-${m}" aria-pressed="${S.time === m}">${fmtMin(m)}</button>`).join('')}</div></div>` : '';
    }).join('')}</div>`;
  }
  const warn = S.warn ? `<p class="warn" role="alert">${S.warn}</p>` : '';
  S.warn = '';

  return `${warn}<div><p class="label">Avec qui ?</p><div class="staff">${staffHtml}</div></div>
    <div><p class="label">Quel jour ?</p><div class="days" id="days">${dayHtml}</div></div>
    <div><p class="label">${idx >= 0 ? cap(fLong.format(days[idx])) + ', à quelle heure ?' : 'À quelle heure ?'}</p>${timesHtml}</div>`;
}

function stepForm(){
  const f = S.form, e = S.errors;
  const field = (id, label, attrs, opt) => `<label for="f-${id}" class="${id === 'note' || id === 'email' ? 'full' : ''}">
      <span>${label}${opt ? ' <span class="opt">(facultatif)</span>' : ''}</span>
      ${id === 'note'
        ? `<textarea id="f-${id}" name="${id}" maxlength="300" placeholder="Longueur actuelle, allergie, photo d’inspiration à montrer…">${esc(f[id])}</textarea>`
        : `<input id="f-${id}" name="${id}" value="${esc(f[id])}" ${attrs} ${e[id] ? 'aria-invalid="true" aria-describedby="e-' + id + '"' : ''}>`}
      ${e[id] ? `<span class="err" id="e-${id}">${e[id]}</span>` : ''}
    </label>`;
  return `<form class="form" id="client-form" novalidate>
      ${field('prenom', 'Prénom', 'autocomplete="given-name" maxlength="40" required')}
      ${field('nom', 'Nom', 'autocomplete="family-name" maxlength="60" required')}
      ${field('tel', 'Téléphone', 'type="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78" required')}
      ${field('email', 'E-mail', 'type="email" autocomplete="email" placeholder="pour recevoir le récapitulatif"', true)}
      ${field('note', 'Un mot pour le salon', '', true)}
    </form>
    <p class="fine">Annulation gratuite en ligne jusqu’à ${CONFIG.cancelHours}${NB}h avant le rendez-vous.</p>`;
}

function recapView(){
  const s = S.svc ? SERVICES[S.svc] : null;
  const row = (k, v) => `<dt>${k}</dt><dd class="${v ? '' : 'none'}">${v || '—'}</dd>`;
  const day = S.day && S.step >= 2 ? cap(fLong.format(parseYmd(S.day))) : '';
  const time = S.time != null && s ? fmtMin(S.time) + ' – ' + fmtMin(S.time + s.m) : '';
  const who = S.step >= 2 ? (S.staff ? STAFF[S.staff].name : 'Sans préférence') : '';
  const hoursRows = [2, 3, 4, 5, 6, 0, 1].map(dow => {
    const h = CONFIG.hours[dow];
    const name = cap(fWkLong.format(new Date(2026, 0, 4 + dow)));
    return `<tr class="${dow === new Date().getDay() ? 'today' : ''}"><td>${name}</td><td>${h ? fmtMin(h[0]) + '–' + fmtMin(h[1]) : 'Fermé'}</td></tr>`;
  }).join('');
  return `<h2 id="recap-title">Votre rendez-vous</h2>
    <dl>
      ${row('Prestation', s ? esc(svcLabel(s)) : '')}
      ${row('Avec', esc(who))}
      ${row('Date', day)}
      ${row('Heure', time)}
      ${row('Durée', s ? fmtDur(s.m) : '')}
    </dl>
    <div class="total"><span>Total, au salon</span><b>${s ? (s.from ? 'dès ' : '') + euro(s.p) : '—'}</b></div>
    <details class="hours"><summary>Horaires du salon</summary><table>${hoursRows}</table></details>`;
}

function doneView(){
  const r = S.done;
  const d = parseYmd(r.date);
  return `<div class="done">
    <div class="done-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg></div>
    <h2 tabindex="-1" id="step-title">C’est noté, ${esc(r.prenom)}.</h2>
    <p>${esc(r.svc)} avec ${esc(r.staffName)}, ${fLong.format(d)} à ${fmtMin(r.time)}, chez ${esc(CONFIG.salon.name)}.</p>
    <p class="ref">Référence ${r.ref}</p>
    <p class="fine">Annulation gratuite en ligne jusqu’à ${CONFIG.cancelHours}${NB}h avant, depuis « Mes rendez-vous ».</p>
    <div class="row"><button type="button" class="btn btn-ghost" data-tab="mine">Voir mes rendez-vous</button><button type="button" class="btn btn-primary" data-restart>Prendre un autre rendez-vous</button></div>
  </div>`;
}

/* ---------- Mes rendez-vous ---------- */
function apptStart(b){ const d = parseYmd(b.date); d.setMinutes(b.time); return d; }
function renderMine(){
  const root = $('#view-mine');
  const now = new Date();
  const sorted = bookings.slice().sort((a, b) => apptStart(a) - apptStart(b));
  const upcoming = sorted.filter(b => apptStart(b) > now);
  const past = sorted.filter(b => apptStart(b) <= now).reverse();
  if (!sorted.length){
    root.innerHTML = `<div class="empty"><h3>Aucun rendez-vous pour l’instant</h3><p>Ceux que vous prenez sur cet appareil apparaîtront ici.</p><button type="button" class="btn btn-primary" data-tab="book">Prendre rendez-vous</button></div>`;
    return;
  }
  const card = (b, isPast) => {
    const d = parseYmd(b.date);
    const hoursLeft = (apptStart(b) - now) / 36e5;
    let actions = '';
    if (!isPast){
      if (hoursLeft < CONFIG.cancelHours) actions = `<span class="fine">Moins de ${CONFIG.cancelHours}${NB}h avant : pour annuler, contactez le salon directement.</span>`;
      else if (S.cancelId === b.id) actions = `<span>Annuler ce rendez-vous ?</span><button type="button" class="btn btn-accent btn-sm" data-cancel-yes="${b.id}" data-key="yes-${b.id}">Oui, annuler</button><button type="button" class="btn btn-ghost btn-sm" data-cancel-no data-key="no-${b.id}">Garder</button>`;
      else actions = `<button type="button" class="link" data-cancel="${b.id}" data-key="cancel-${b.id}">Annuler</button>`;
    }
    return `<li class="appt ${isPast ? 'past' : ''}">
      <div class="when"><span class="dw">${fWk.format(d)}</span><span class="dn">${d.getDate()}</span><span class="dm">${fMon.format(d)}</span></div>
      <div class="appt-main">
        <p class="appt-time">${fmtMin(b.time)} – ${fmtMin(b.time + b.dur)} · ${b.from ? 'dès ' : ''}${euro(b.price)}</p>
        <p class="appt-svc">${esc(b.svc)}</p>
        <p class="appt-meta">Avec ${esc(b.staffName)} · référence <span class="mono">${esc(b.ref)}</span></p>
        ${actions ? `<div class="appt-actions">${actions}</div>` : ''}
      </div>
    </li>`;
  };
  root.innerHTML = `<div class="mine">
    ${upcoming.length ? `<h2>À venir</h2><ul class="appt-list">${upcoming.map(b => card(b, false)).join('')}</ul>` : '<div class="empty"><h3>Aucun rendez-vous à venir</h3><button type="button" class="btn btn-primary" data-tab="book">Prendre rendez-vous</button></div>'}
    ${past.length ? `<h2>Passés</h2><ul class="appt-list">${past.map(b => card(b, true)).join('')}</ul>` : ''}
  </div>`;
}

function updateCount(){
  const n = bookings.filter(b => apptStart(b) > new Date()).length;
  const c = $('#count');
  c.textContent = n;
  c.hidden = n === 0;
}

/* ---------- Render, keeping focus and the day strip position ---------- */
function render(){
  const active = document.activeElement;
  const key = active && active.dataset ? active.dataset.key : null;
  const oldDays = $('#days');
  const scroll = oldDays ? oldDays.scrollLeft : 0;
  $('#view-book').hidden = S.tab !== 'book';
  $('#view-mine').hidden = S.tab !== 'mine';
  ['book', 'mine'].forEach(t => $('#tab-' + t).setAttribute('aria-selected', String(S.tab === t)));
  if (S.tab === 'book') renderBook(); else renderMine();
  updateCount();
  const days = $('#days');
  if (days){
    days.scrollLeft = scroll;
    const on = $('[aria-pressed="true"]', days);
    if (!oldDays && on) days.scrollLeft = Math.max(0, on.offsetLeft - days.offsetLeft - 8);
  }
  if (S.focusHeading){
    S.focusHeading = false;
    const h = $('#step-title');
    if (h) h.focus({ preventScroll: true });
    const top = $('.tabs').getBoundingClientRect().top + window.scrollY - 8;
    if (window.scrollY > top) window.scrollTo(0, top);
  } else if (key){
    const el = document.querySelector(`[data-key="${key}"]`);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
}

function goStep(n){ S.step = n; S.errors = {}; S.focusHeading = true; render(); }

function resetBooking(){
  const f = S.form;
  Object.assign(S, { step: 1, svc: null, staff: '', day: null, time: null, errors: {}, done: null, warn: '' });
  S.form = { prenom: f.prenom, nom: f.nom, tel: f.tel, email: f.email, note: '' };
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.tab){ S.tab = b.dataset.tab; S.cancelId = null; if (S.tab === 'book' && S.step === 4) resetBooking(); render(); return; }
  if (b.dataset.go){ goStep(+b.dataset.go); return; }
  if (b.dataset.staff !== undefined){ S.staff = b.dataset.staff; render(); return; }
  if (b.dataset.day){ S.day = b.dataset.day; S.time = null; render(); return; }
  if (b.dataset.time){ S.time = +b.dataset.time; render(); return; }
  if (b.hasAttribute('data-restart')){ resetBooking(); S.focusHeading = true; render(); return; }
  if (b.dataset.cancel){ S.cancelId = b.dataset.cancel; render(); const y = $('[data-cancel-yes]'); if (y) y.focus(); return; }
  if (b.hasAttribute('data-cancel-no')){ S.cancelId = null; render(); return; }
  if (b.dataset.cancelYes){ store.remove(b.dataset.cancelYes); S.cancelId = null; render(); return; }
});

document.addEventListener('change', e => {
  if (e.target.name !== 'svc') return;
  S.svc = e.target.value;
  S.time = null;
  const next = $('[data-key="next"]');
  if (next) next.disabled = false;
  $('.foot .hint').textContent = 'Prix à régler au salon.';
  $('.recap').innerHTML = recapView();
});
document.addEventListener('input', e => {
  if (e.target.form && e.target.form.id === 'client-form') S.form[e.target.name] = e.target.value;
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'client-form') return;
  e.preventDefault();
  const f = S.form;
  const errors = {};
  if (!f.prenom.trim()) errors.prenom = 'Indiquez votre prénom.';
  if (!f.nom.trim()) errors.nom = 'Indiquez votre nom.';
  if (!/^(?:\+33\s?|0)[1-9](?:[\s.\-]?\d{2}){4}$/.test(f.tel.trim())) errors.tel = 'Numéro attendu au format 06 12 34 56 78.';
  if (f.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) errors.email = 'Adresse e-mail incomplète.';
  S.errors = errors;
  if (Object.keys(errors).length){
    render();
    const first = $('#f-' + Object.keys(errors)[0]);
    if (first) first.focus();
    return;
  }
  const svc = SERVICES[S.svc];
  const date = parseYmd(S.day);
  /* The slot may have been taken since it was shown: check again, then assign a person */
  const who = team(S.staff).find(st => isFree(st, date, S.time, svc.m));
  if (!who){
    S.warn = 'Ce créneau vient d’être pris. Choisissez-en un autre, vos coordonnées sont gardées.';
    S.time = null;
    goStep(2);
    return;
  }
  const rec = {
    id: Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
    ref: 'FR-' + Math.random().toString(36).slice(2, 7).toUpperCase(),
    date: S.day, time: S.time, dur: svc.m, svcId: svc.id, svc: svcLabel(svc), price: svc.p, from: !!svc.from,
    staffId: who.id, staffName: who.name,
    prenom: f.prenom.trim(), nom: f.nom.trim(), tel: f.tel.trim(), email: f.email.trim(), note: f.note.trim()
  };
  store.add(rec);
  S.done = rec;
  S.step = 4;
  S.focusHeading = true;
  render();
});

store.load();
renderHeader();
render();
})();
</script>
</body>
