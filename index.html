<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Naïade — SCADA Eau Potable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════════════════════════
   Naïade SCADA — Industrial dark control-room theme
   ════════════════════════════════════════════════════════════════════ */

:root {
  /* surfaces */
  --bg:        #0a0e13;
  --bg-2:      #0c1117;
  --panel:     #121821;
  --panel-2:   #161d27;
  --panel-3:   #1a2230;
  --border:    #1f2731;
  --border-2:  #2a3340;
  --hover:     #1c2531;

  /* text */
  --text:      #d6dde6;
  --text-dim:  #8590a0;
  --text-faint:#4d5663;

  /* accent (overridden by JS) */
  --accent:    #4dd0e1;
  --accent-l:  #88e3ee;
  --accent-12: #4dd0e11f;

  /* status */
  --status-ok:       #4ade80;
  --status-minor:    #fbbf24;
  --status-major:    #fb923c;
  --status-critical: #ef4444;
  --status-ok-12:       rgba(74, 222, 128, .12);
  --status-minor-12:    rgba(251, 191, 36, .12);
  --status-major-12:    rgba(251, 146, 60, .12);
  --status-critical-12: rgba(239, 68, 68, .12);

  /* map */
  --country-fill: #131a23;
  --country-line: #2f3a48;
  --grid-line:    #1e2530;
  --grid-dot:     #1c2330;
  --river:        #3a6175;
  --pipe:         #506270;

  /* type */
  --ui:   "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

  --side-w: 320px;
  --header-h: 56px;
  --pad: 14px;
  --radius: 4px;
}

[data-density="compact"] {
  --side-w: 280px;
  --header-h: 48px;
  --pad: 10px;
}

[data-bigtext="1"] {
  font-size: 15px;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim  { color: var(--text-dim); }
.sm   { font-size: 11px; }

button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; }

/* ─── App shell ─────────────────────────────────────── */

.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  height: 100vh;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(77, 208, 225, .04), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(77, 208, 225, .03), transparent 60%),
    var(--bg);
}

/* subtle scanline */
.app::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(
    to bottom, transparent 0, transparent 2px,
    rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px
  );
}

/* ─── Top bar ─────────────────────────────────────── */

.topbar {
  display: grid;
  grid-template-columns: 220px auto 1fr auto auto;
  align-items: center;
  gap: 22px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
  position: relative;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-weight: 600; letter-spacing: .14em; font-size: 13px; color: var(--accent); }
.brand-sub  { font-size: 10px; color: var(--text-faint); letter-spacing: .08em; font-family: var(--mono); }

.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.crumb.active { color: var(--text); }
.crumb.dim    { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
.sep { color: var(--text-faint); }
.link-btn { color: var(--accent); padding: 4px 8px; border: 1px solid var(--border); border-radius: 3px; font-size: 11px; }
.link-btn:hover { background: var(--hover); border-color: var(--accent); }

.search {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 6px 10px;
  min-width: 380px;
  max-width: 480px;
  color: var(--text-dim);
}
.search:focus-within { border-color: var(--accent); }
.search input { background: transparent; border: 0; color: var(--text); outline: none; flex: 1; font: inherit; }
.search kbd {
  font-family: var(--mono); font-size: 10px;
  background: var(--bg-2); padding: 1px 5px; border-radius: 2px;
  border: 1px solid var(--border); color: var(--text-dim);
}
.search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--panel); border: 1px solid var(--border-2); border-radius: 4px;
  max-height: 320px; overflow-y: auto; z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.search-row {
  display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px;
  width: 100%; padding: 8px 12px; align-items: center;
  border-bottom: 1px solid var(--border); text-align: left;
}
.search-row:hover { background: var(--hover); }
.sr-name { font-size: 12px; }
.sr-city { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.sr-region { font-size: 10px; color: var(--text-faint); }

.status-counts { display: flex; gap: 6px; }
.sc {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 2px;
  cursor: pointer; transition: background .15s, border-color .15s, opacity .15s;
}
.sc:hover { background: var(--hover); border-color: var(--border-2); }
.sc.on { box-shadow: 0 0 0 1px currentColor inset; }
.sc.off { opacity: .42; }
.sc.off:hover { opacity: .85; }
.sc-n { font-family: var(--mono); font-size: 12px; }

.topbar-meta { display: flex; align-items: center; gap: 18px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; line-height: 1.2; }
.clock .mono { font-size: 13px; }
.clock .dim  { font-size: 9px; letter-spacing: .08em; }
.user { display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 1px solid var(--border); }
.avatar {
  width: 28px; height: 28px; border-radius: 999px;
  background: var(--panel-3);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  border: 1px solid var(--border-2);
}
.user-name { font-size: 12px; line-height: 1.1; }
.user-role { font-size: 10px; color: var(--text-dim); font-family: var(--mono); }

/* ─── Main layouts ─────────────────────────────────────── */

.main { overflow: hidden; }
.main.map-layout {
  display: grid;
  grid-template-columns: var(--side-w) 1fr var(--side-w);
  height: calc(100vh - var(--header-h));
}

.side {
  display: flex; flex-direction: column;
  background: var(--panel);
  overflow: hidden;
}
.side.left  { border-right: 1px solid var(--border); }
.side.right { border-left:  1px solid var(--border); }

.panel-h {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 12px var(--pad) 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-t {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-dim); font-weight: 500;
}
.panel-c { font-size: 10px; display: flex; align-items: center; gap: 6px; }
.dot-sep { color: var(--text-faint); }

/* Facility list */
.filter-row {
  display: flex; gap: 4px; padding: 8px var(--pad); border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 2px;
  background: var(--panel-2); color: var(--text-dim); font-size: 11px;
}
.chip:hover { background: var(--hover); color: var(--text); }
.chip.on { background: var(--bg-2); }
.chip-n { font-family: var(--mono); font-size: 10px; opacity: .7; }

.fac-list { flex: 1; overflow-y: auto; }
.fac-row {
  display: grid; grid-template-columns: 14px 1fr auto;
  gap: 10px; align-items: center;
  width: 100%; padding: 8px var(--pad);
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.fac-row:hover, .fac-row.hover { background: var(--hover); }
.fac-row.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
.fr-main { display: flex; flex-direction: column; min-width: 0; }
.fr-name { font-size: 12px; line-height: 1.2; }
.fr-sub  { font-size: 10px; line-height: 1.1; margin-top: 2px; }
.fr-load { font-size: 11px; text-align: right; }
.fr-load-v { color: var(--text); }
.fr-load-u { font-size: 10px; }

/* Map */
.map-wrap {
  position: relative;
  background:
    radial-gradient(circle at 50% 50%, var(--panel) 0%, var(--bg) 70%),
    var(--bg);
  overflow: hidden;
}
.france-svg { width: 100%; height: 100%; display: block; }
.map-corner {
  position: absolute; padding: 8px 12px; font-family: var(--mono); font-size: 10px;
  line-height: 1.4; color: var(--text-dim); pointer-events: none;
  background: rgba(10, 14, 19, .65); backdrop-filter: blur(6px);
  border: 1px solid var(--border);
}
.map-corner.tl { top: 16px; left: 16px; }
.map-corner.br { bottom: 16px; right: 16px; text-align: right; }
.map-corner.tl .mono:first-child { color: var(--accent); letter-spacing: .12em; }

.status-dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: .7; }
}
.fac-dot .halo { animation: halo 2.2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
.fac-dot.pulse-slow .halo { animation-duration: 3.4s; }
@keyframes halo {
  0%   { r: 8;  opacity: .55; }
  100% { r: 24; opacity: 0; }
}
.fac-dot:hover circle:nth-child(1) { opacity: .35; }

.flow-dash {
  stroke-dashoffset: 0;
  animation: flow 1.4s linear infinite;
}
@keyframes flow {
  to { stroke-dashoffset: -18; }
}
.pump-rotor { animation: spin 2s linear infinite; transform-origin: center; transform-box: fill-box; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Alarms ─────────────────────────────────────── */

.alarm-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.alarm-list.compact .alarm-row { padding: 8px var(--pad); }
.alarm-row {
  display: grid; grid-template-columns: 3px 1fr; gap: 10px;
  padding: 10px var(--pad);
  border-bottom: 1px solid var(--border);
}
.al-bar { width: 3px; height: 100%; }
.al-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.al-head { display: flex; justify-content: space-between; align-items: baseline; }
.al-code { font-size: 11px; color: var(--text); letter-spacing: .04em; }
.al-ts { font-size: 10px; }
.al-msg { font-size: 12px; line-height: 1.35; color: var(--text); }
.al-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.al-fac {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 2px;
  font-size: 10px;
}
.al-fac:hover { border-color: var(--accent); color: var(--accent); }
.al-src { font-size: 10px; }
.alarm-row.acked .al-msg { color: var(--text-dim); }
.alarm-row.acked .al-bar { opacity: .35; }
.al-acked { font-size: 10px; font-style: italic; }
.btn-xs {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  padding: 3px 8px; background: var(--bg-2); border: 1px solid var(--border-2);
  border-radius: 2px; color: var(--text); margin-left: auto;
}
.btn-xs:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.kpi-strip {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
  border-top: 1px solid var(--border);
  background: var(--border);
}
.kpi-strip .kpi { background: var(--panel); padding: 10px var(--pad); }

/* ─── KPI tiles ─────────────────────────────────────── */

.kpi {
  display: flex; flex-direction: column; gap: 6px;
  padding: 12px var(--pad);
  border: 1px solid var(--border);
  background: var(--panel);
}
.kpi.tiny { gap: 2px; border: 0; padding: 8px 10px; }
.kpi.big  { gap: 8px; padding: 14px; }
.kpi-l { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); }
.kpi-v { font-size: 22px; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
.kpi.tiny .kpi-v { font-size: 17px; }
.kpi.big  .kpi-v { font-size: 26px; }
.kpi-u { font-size: 11px; }
.kpi-range { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .04em; }

/* sparkline */
.spark { display: block; }

/* Pill */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 2px;
  font-size: 11px; letter-spacing: .04em;
  border: 1px solid;
  font-family: var(--mono);
}

/* ─── Facility view ─────────────────────────────────────── */

.main.facility-layout {
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: calc(100vh - var(--header-h));
  overflow-y: auto;
  background: var(--bg);
}

.fac-head {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 18px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
}
.back-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 3px; color: var(--text-dim); font-size: 12px;
}
.back-btn:hover { color: var(--accent); border-color: var(--accent); }
.fac-title h1 {
  margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.01em;
  display: inline-block; margin-right: 12px;
}
.ft-row { display: flex; align-items: center; gap: 10px; }
.ft-sub { font-size: 11px; margin-top: 4px; display: flex; gap: 10px; letter-spacing: .04em; }
.ft-sub .sep { color: var(--text-faint); }

.fac-head-stats { display: flex; gap: 1px; background: var(--border); }
.fhs {
  background: var(--panel); padding: 10px 16px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 110px;
}
.fhs-l { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); }
.fhs-v { font-size: 20px; line-height: 1; display: flex; align-items: baseline; gap: 4px; }
.fhs-u { font-size: 10px; }

/* KPI grid */
.kpi-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.kpi-grid .kpi { border: 0; }
.kpi-grid .kpi:hover { background: var(--panel-2); }

/* Body grid */
.fac-body {
  display: grid; grid-template-columns: 1fr 380px;
  gap: 1px; background: var(--border);
}
.fac-col { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
.main-col { min-width: 0; }
.side-col { background: var(--panel); }

/* Process diagram */
.process { background: var(--panel); padding: 0; display: flex; flex-direction: column; }
.process-svg-wrap {
  padding: 14px;
  background:
    linear-gradient(var(--panel), var(--panel)),
    radial-gradient(circle at 50% 50%, var(--panel-2) 0%, var(--panel) 60%);
  min-height: 360px;
}
.process-svg { width: 100%; height: auto; display: block; max-height: 420px; }
.process-legend {
  display: flex; gap: 18px; padding: 8px var(--pad);
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-dim); align-items: center; flex-wrap: wrap;
}
.lg-line { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 6px; }
.lg-dot  { display: inline-block; width: 8px; height: 8px; border-radius: 999px; vertical-align: middle; margin-right: 6px; }
.pnode.alert rect:nth-child(2) { animation: alertbox 1.6s ease-in-out infinite; }
@keyframes alertbox {
  0%, 100% { opacity: 1; }
  50% { opacity: .65; }
}

/* Trend chart */
.trend { background: var(--panel); }
.trend-tabs { display: flex; gap: 1px; background: var(--border); margin-right: -1px; }
.tt {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 6px 12px; background: var(--panel);
  border-bottom: 2px solid transparent; min-width: 100px;
}
.tt:hover { background: var(--hover); }
.tt.on { border-bottom-color: var(--accent); background: var(--panel-2); }
.tt-l { font-size: 10px; color: var(--text-dim); letter-spacing: .06em; text-transform: uppercase; }
.tt-v { font-size: 14px; }
.trend-svg { width: 100%; height: 240px; padding: 8px var(--pad); display: block; }

/* Equipment table */
.equip { background: var(--panel); }
.equip-table-wrap { overflow-x: auto; }
.equip-table { width: 100%; border-collapse: collapse; }
.equip-table th, .equip-table td {
  text-align: left; padding: 9px var(--pad);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.equip-table th {
  font-weight: 500; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim); background: var(--panel-2);
  position: sticky; top: 0;
}
.equip-table td.num { text-align: right; }
.equip-table tr:hover td { background: var(--hover); }
.eq-tag {
  display: inline-block; padding: 2px 6px; border: 1px solid var(--border-2);
  border-radius: 2px; font-size: 11px; color: var(--accent);
}
.eq-state {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border: 1px solid; border-radius: 2px;
  font-size: 10px; letter-spacing: .06em;
}

/* Side col panels */
.fac-alarms, .oplog, .nearby { background: var(--panel); border-bottom: 1px solid var(--border); }
.empty {
  display: flex; align-items: center; gap: 10px;
  padding: 14px var(--pad); color: var(--text-dim); font-size: 12px;
}
.log-list { list-style: none; margin: 0; padding: 4px 0; max-height: 320px; overflow-y: auto; }
.log-row {
  display: grid; grid-template-columns: 60px 90px 1fr; gap: 10px;
  padding: 6px var(--pad); font-size: 11px; line-height: 1.35;
  border-bottom: 1px solid var(--border);
}
.log-ts { font-size: 10px; }
.log-who { font-size: 10px; letter-spacing: .04em; }
.log-row.sys .log-who { color: var(--accent); }
.log-row.op  .log-who { color: var(--status-ok); }

.nearby-list { padding: 4px 0; }
.nearby-row {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 8px;
  width: 100%; padding: 6px var(--pad); align-items: center;
  font-size: 12px; text-align: left;
  border-bottom: 1px solid var(--border);
}
.nearby-row:hover { background: var(--hover); }
.nb-d { font-size: 10px; }

/* Node detail */
.node-detail {
  background: var(--panel-2);
  border-left: 2px solid var(--accent);
  padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.nd-h { display: flex; justify-content: space-between; align-items: flex-start; }
.nd-tag { font-size: 10px; color: var(--accent); letter-spacing: .1em; }
.nd-name { font-size: 15px; margin-top: 2px; }
.x {
  width: 24px; height: 24px; border-radius: 2px;
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border);
}
.x:hover { color: var(--text); background: var(--hover); }
.nd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); }
.nd-cell { background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.nd-l { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); }
.nd-v { font-size: 15px; }
.nd-v.sm { font-size: 11px; }
.nd-controls { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid var(--border); }
.ctrl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toggle {
  position: relative; display: flex; align-items: center;
  width: 130px; height: 28px;
  background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 2px;
  padding: 2px; cursor: pointer;
}
.toggle-knob {
  position: absolute; top: 2px; left: 2px;
  width: 62px; height: 22px;
  background: var(--status-critical); border-radius: 2px;
  transition: transform .25s ease, background .25s ease;
}
.toggle.on .toggle-knob { transform: translateX(62px); background: var(--status-ok); }
.toggle-on, .toggle-off {
